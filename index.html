<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Karla:wght@400;600&display=swap">
<style>
  :root {
    --ground: #e6e8e1;
    --ink: #23291d;
    --muted: #646b5a;
    --bezel: #2e3329;
    --bezel-edge: #1c2018;
    --lcd: #b9c49a;
    --lcd-ink: #26301b;
    --key: #d4d8cb;
    --key-ink: #2e3329;
    --focus: #6f8a2e;
    --display: "Silkscreen", "Courier New", monospace;
    --digits: "VT323", "Courier New", monospace;
    --body: "Karla", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #15180f;
      --ink: #dfe4d2;
      --muted: #939b84;
      --bezel: #0a0c07;
      --bezel-edge: #30362a;
      --key: #2a2f24;
      --key-ink: #dfe4d2;
      --focus: #a9c46a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #15180f;
    --ink: #dfe4d2;
    --muted: #939b84;
    --bezel: #0a0c07;
    --bezel-edge: #30362a;
    --key: #2a2f24;
    --key-ink: #dfe4d2;
    --focus: #a9c46a;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 20px;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .hud {
    display: flex;
    gap: 18px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1;
  }
  .stat span {
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat b {
    font-family: var(--digits);
    font-weight: 400;
    font-size: 30px;
    font-variant-numeric: tabular-nums;
  }

  .device {
    background: var(--bezel);
    border: 1px solid var(--bezel-edge);
    border-radius: 18px 18px 18px 42px;
    padding: 14px;
    box-shadow: 0 10px 30px -12px rgba(20, 25, 12, 0.5);
    width: min(100%, 480px, max(260px, calc(100dvh - 300px)));
    box-sizing: border-box;
  }
  .screen {
    position: relative;
    aspect-ratio: 1;
    max-width: 100%;
    background: var(--lcd);
    border-radius: 6px;
    overflow: hidden;
    touch-action: none;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    color: var(--lcd-ink);
    background: rgba(185, 196, 154, 0.82);
    padding: 16px;
    cursor: pointer;
  }
  .overlay h2 {
    font-family: var(--display);
    font-size: clamp(22px, 7vw, 34px);
    margin: 0;
    letter-spacing: 0.04em;
  }
  .overlay p {
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: 0.08em;
    margin: 0;
    max-width: 26ch;
    line-height: 1.6;
  }
  .overlay .big {
    font-family: var(--digits);
    font-size: 44px;
    line-height: 1;
  }
  .overlay button {
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: 0.08em;
    background: var(--lcd-ink);
    color: #b9c49a;
    border: 0;
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: 0.16em;
    color: #8a9278;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 52px);
    gap: 6px;
  }
  .pad button {
    background: var(--key);
    color: var(--key-ink);
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 10px;
    font-size: 20px;
    touch-action: manipulation;
    cursor: pointer;
  }
  .pad button:active { transform: translateY(1px); filter: brightness(0.92); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .mid { grid-column: 2; grid-row: 2; font-family: var(--display); font-size: 10px; letter-spacing: 0.06em; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }

  .keys {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.7;
    margin: 0;
  }
  kbd {
    font-family: var(--display);
    font-size: 10px;
    border: 1px solid var(--muted);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink);
  }
  @media (pointer: fine) { .pad { display: none; } }
  @media (pointer: coarse) { .keys { display: none; } }

  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Snake</h1>
    <div class="hud">
      <div class="stat"><span>Punkte</span><b id="score">0</b></div>
      <div class="stat"><span>Länge</span><b id="length">3</b></div>
      <div class="stat"><span>Rekord</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="device">
    <div class="screen" id="screen">
      <canvas id="board" aria-label="Spielfeld"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Snake</h2>
        <div class="big" id="ov-score" hidden></div>
        <p id="ov-text">Pfeiltaste drücken oder tippen zum Starten</p>
        <button id="ov-btn" type="button" hidden>Nochmal</button>
      </div>
    </div>
    <div class="brand"><span>20 × 20</span><span>Mono LCD</span></div>
  </div>

  <div class="pad" aria-label="Steuerkreuz">
    <button class="up" type="button" data-dir="up" aria-label="Hoch">▲</button>
    <button class="left" type="button" data-dir="left" aria-label="Links">◀</button>
    <button class="mid" type="button" id="pause-btn" aria-label="Pause">II</button>
    <button class="right" type="button" data-dir="right" aria-label="Rechts">▶</button>
    <button class="down" type="button" data-dir="down" aria-label="Runter">▼</button>
  </div>

  <p class="keys">
    <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> oder <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> lenken ·
    <kbd>Leertaste</kbd> Pause · <kbd>Enter</kbd> Neustart
  </p>
</div>

<script>
(() => {
  const N = 20;
  const START_STEP = 150, MIN_STEP = 65, STEP_DELTA = 4;
  const LCD = "#b9c49a", PIXEL = "#26301b", GHOST = "rgba(38, 48, 27, 0.06)";
  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const screen = document.getElementById("screen");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovScore = document.getElementById("ov-score");
  const ovText = document.getElementById("ov-text");
  const ovBtn = document.getElementById("ov-btn");
  const scoreEl = document.getElementById("score");
  const lengthEl = document.getElementById("length");
  const bestEl = document.getElementById("best");

  let snake, dir, queue, food, score, step;
  let state = "ready"; // ready | running | paused | over
  let acc = 0, last = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem("snake-best"), 10) || 0; } catch (e) {}

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    step = START_STEP;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    lengthEl.textContent = snake.length;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, withScore) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovScore.hidden = !withScore;
    ovScore.textContent = withScore ? score + " Punkte" : "";
    ovBtn.hidden = !withScore;
    overlay.hidden = false;
  }

  function start() {
    if (state === "over") reset();
    state = "running";
    acc = 0;
    overlay.hidden = true;
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      showOverlay("Pause", "Leertaste oder tippen zum Weiterspielen", false);
    } else if (state === "paused") {
      start();
    }
  }

  function gameOver(won) {
    state = "over";
    if (score > best) {
      best = score;
      try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
      updateHud();
      showOverlay(won ? "Gewonnen!" : "Game Over", "Neuer Rekord!", true);
    } else {
      showOverlay(won ? "Gewonnen!" : "Game Over", "Rekord: " + best, true);
    }
  }

  function turn(name) {
    const d = DIRS[name];
    if (state === "paused") return;
    if (state === "ready" || state === "over") start();
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (d === ref || (d.x === -ref.x && d.y === -ref.y)) return;
    if (queue.length < 2) queue.push(d);
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(false);
      return;
    }
    snake.unshift(head);
    if (eating) {
      score++;
      step = Math.max(MIN_STEP, step - STEP_DELTA);
      placeFood();
      if (!food) { updateHud(); gameOver(true); return; }
    } else {
      snake.pop();
    }
    updateHud();
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = Math.round(screen.clientWidth * dpr);
    if (canvas.width !== size) { canvas.width = size; canvas.height = size; }
  }

  function draw(t) {
    resize();
    const size = canvas.width;
    const c = size / N;
    const gap = Math.max(1, c * 0.1);
    ctx.fillStyle = LCD;
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = GHOST;
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        ctx.fillRect(x * c + gap / 2, y * c + gap / 2, c - gap, c - gap);

    ctx.fillStyle = PIXEL;
    snake.forEach((s, i) => {
      const inset = i === 0 ? gap / 2 : gap;
      ctx.fillRect(s.x * c + inset, s.y * c + inset, c - inset * 2, c - inset * 2);
    });

    // Augen am Kopf, in Blickrichtung
    const h = snake[0];
    const e = c * 0.16;
    ctx.fillStyle = LCD;
    const cx = h.x * c + c / 2, cy = h.y * c + c / 2;
    const fx = dir.x * c * 0.18, fy = dir.y * c * 0.18;
    const px = -dir.y * c * 0.2, py = dir.x * c * 0.2;
    ctx.fillRect(cx + fx + px - e / 2, cy + fy + py - e / 2, e, e);
    ctx.fillRect(cx + fx - px - e / 2, cy + fy - py - e / 2, e, e);

    if (food) {
      ctx.fillStyle = PIXEL;
      const q = c / 3;
      const fx0 = food.x * c, fy0 = food.y * c;
      ctx.fillRect(fx0 + q, fy0 + gap, q, q);
      ctx.fillRect(fx0 + gap, fy0 + q, q, q);
      ctx.fillRect(fx0 + c - q - gap, fy0 + q, q, q);
      ctx.fillRect(fx0 + q, fy0 + c - q - gap, q, q);
    }
  }

  function frame(t) {
    if (state === "running") {
      acc += Math.min(t - last, 250);
      while (acc >= step && state === "running") {
        acc -= step;
        tick();
      }
    }
    last = t;
    draw(t);
    requestAnimationFrame(frame);
  }

  document.addEventListener("keydown", e => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      turn(KEYMAP[e.key]);
    } else if (e.key === " ") {
      e.preventDefault();
      if (state === "running" || state === "paused") togglePause();
      else start();
    } else if (e.key === "Enter") {
      e.preventDefault();
      state = "over";
      start();
    } else if (e.key === "Escape" || e.key === "p" || e.key === "P") {
      togglePause();
    }
  });

  overlay.addEventListener("click", () => {
    if (state === "paused") togglePause(); else start();
  });
  ovBtn.addEventListener("click", e => { e.stopPropagation(); start(); });

  document.querySelectorAll(".pad [data-dir]").forEach(b =>
    b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.dir); })
  );
  document.getElementById("pause-btn").addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "running" || state === "paused") togglePause(); else start();
  });

  let touch = null;
  screen.addEventListener("touchstart", e => {
    const p = e.changedTouches[0];
    touch = { x: p.clientX, y: p.clientY };
  }, { passive: true });
  screen.addEventListener("touchend", e => {
    if (!touch) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    e.preventDefault();
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? "right" : "left");
    else turn(dy > 0 ? "down" : "up");
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "running") togglePause();
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
